name: Build MundoLoader APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MundoLoader
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK & NDK
        run: |
          sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build Latest FeaturesticMundoSDK AAR
        run: |
          mkdir -p sdk
          git clone --depth 1 https://github.com/ravipacharpro-jpg/FeaturesticMundoSDK.git sdk/FeaturesticMundoSDK
          cd sdk/FeaturesticMundoSDK
          chmod +x ./gradlew
          ./gradlew clean :FeaturesticMundo:assembleRelease --no-daemon --stacktrace
          cd ../..
          cp sdk/FeaturesticMundoSDK/FeaturesticMundo/build/outputs/aar/FeaturesticMundo-release.aar app/libs/FeaturesticMundo-release.aar
          ls -lh app/libs/FeaturesticMundo-release.aar

      - name: Build Signed MundoLoader APK
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/MundoLoader-release.apk
          ls -lh dist/MundoLoader-release.apk

      - name: Publish Release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 && gh release delete v1.0.0 --yes --cleanup-tag || true
          git push origin --delete v1.0.0 >/dev/null 2>&1 || true
          gh release create v1.0.0 dist/MundoLoader-release.apk#MundoLoader-release.apk \
            --title "MundoLoader v1.0.0" \
            --notes "MundoLoader test APK powered by FeaturesticMundoSDK v1.1.0." \
            --target "$GITHUB_SHA"
